<script type="text/javascript">

  var protocol = location.protocol;
  var wsprotocol
  if (protocol === "https:") {
    wsprotocol = "wss:";
  } else {
    wsprotocol = "ws:";
  }
  var slashes = protocol.concat("//");
  var host = slashes.concat(window.location.host);

  window.wsUrl = ""
  if (window.wsUrl === '') {
    window.wsUrl = window.location.host
  }

  window.pushNoti = function toastrNoti(message, duration, type) {
    if (type === "error") {
      iziToast.error({
        title: 'Error',
        message: message,
        theme: 'dark',
        backgroundColor: "#3e3e3e",
        messageColor: "white",
        titleColor: "#f44242",
        position: 'bottomCenter',
        timeout: duration,
        class: 'toaster',
      });
    } else {
      iziToast.success({
        title: 'OK',
        message: message,
        theme: 'dark',
        backgroundColor: "#3e3e3e",
        messageColor: "white",
        titleColor: "#1db954",
        position: 'bottomCenter',
        timeout: duration,
        class: 'toaster',
      });
    }
  }

  window.getCookie = function getcookie(cname) {
    var name = cname + "=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for (var i = 0; i < ca.length; i++) {
      var c = ca[i];
      while (c.charAt(0) == ' ') {
        c = c.substring(1);
      }
      if (c.indexOf(name) == 0) {
        return c.substring(name.length, c.length);
      }
    }
    return "";
  }

  window.setCookie = function setcookie(cname, cvalue, exdays) {
    var d = new Date();
    d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
    var expires = "expires=" + d.toUTCString();
    document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
  }

  window.toTitle = function toTitleCase(str) {
    return str.replace(/\w\S*/g, function (txt) {
      return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    });
  }

  window.getUrlParams = function (key) {
    let url = location.href
    var params = {};
    (url + '?').split('?')[1].split('&').forEach(function (pair) {
      pair = (pair + '=').split('=').map(decodeURIComponent);
      if (pair[0].length) {
        params[pair[0]] = pair[1];
      }
    });
    return params[key];
  };

  window.stripHtml = function (html) {
    let tmp = document.createElement("DIV");
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || "";
  }

  window.timeConverter = function tConverter(UNIX_timestamp) {
    var a = new Date(UNIX_timestamp * 1000);
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var dates = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    var month = months[a.getMonth()];
    var date = a.getDate();
    var time = dates[a.getDay()] + ' ' + month + ' ' + date
    return time;
  }

  window.roundToX = function (num, X) {
    return +(Math.round(num + "e+" + X) + "e-" + X);
  }
</script>
